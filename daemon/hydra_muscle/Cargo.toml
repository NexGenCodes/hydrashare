[package]
name = "hydra_muscle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]  # rlib needed for bin target

[dependencies]
sha2 = "0.10"
aes-gcm = "0.10.3"
rand = "0.8"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
once_cell = "1.21.3"
base64 = "0.22"
x509-parser = "0.16"

# New Architecture Dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "1.0"
anyhow = "1.0"
directories = "5.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
mdns-sd = "0.11" # Pure Rust mDNS discovery
hostname = "0.4"
pbkdf2 = "0.12"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }

[dev-dependencies]


# Windows-specific dependencies for TransmitFile
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

# Linux/Android dependencies for sendfile
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
